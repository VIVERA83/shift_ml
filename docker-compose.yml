services:
  redis:
    restart: always
    image: redis:latest
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_volume:/var/lib/redis/
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}

  postgres:
    restart: always
    container_name: postgres
    image: postgres:latest
    volumes:
      - postgres_volume:/var/lib/postgresql/data/
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -V" ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: -p ${POSTGRES_PORT}

  app:
    build: .
    env_file:
      - .env
    expose:
      - ${PORT}  # Используем переменную для порта
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started


  migrations:
    build:
      context: .
      dockerfile: Dockerfile_migrations
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head

  nginx:
    image: nginx:latest
    ports:
      - 80:80
    env_file:
      - .env
    volumes:
      - ./app/static:/app/static:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - APP_PORT=${PORT}
    depends_on:
      - app

volumes:
  redis_volume:
  postgres_volume:

